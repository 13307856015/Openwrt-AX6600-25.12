name: Build ImmortalWrt 25.12 for AX6600

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'immortalwrt tag/branch to build (25.12 line)'
        required: true
        default: 'v25.12.2'
        type: string
      extra_packages:
        description: 'extra package names, space separated (optional)'
        required: false
        default: ''
        type: string
      create_release:
        description: 'create a GitHub release with the built images'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: qualcommax/ipq60xx - jdcloud_re-cs-02
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout backport kit
        uses: actions/checkout@v4

      - name: Show runner resources
        run: |
          nproc
          free -h
          df -h /

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential bzip2 ca-certificates ccache clang cmake cpio curl \
            device-tree-compiler dos2unix file flex g++-multilib gawk gcc-multilib \
            genisoimage gettext git jq libbpf-dev libclang-dev libdw-dev libelf-dev \
            libncurses-dev libssl-dev lld llvm ninja-build patch perl pkgconf python3 \
            python3-cryptography python3-dev python3-packaging python3-pyelftools \
            python3-setuptools qemu-utils rsync swig unzip wget xz-utils zlib1g-dev zstd

      - name: Clone ImmortalWrt (${{ inputs.ref }})
        run: |
          git clone --depth 1 --branch "${{ inputs.ref }}" \
            https://github.com/immortalwrt/immortalwrt.git openwrt
          cd openwrt
          echo "HEAD: $(git log -1 --oneline)"
          grep -m1 '^VERSION_NUMBER' include/version.mk || true

      - name: Apply AX6600 backport patches
        run: |
          cd openwrt
          shopt -s nullglob
          patches=("$GITHUB_WORKSPACE"/patches/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "::error::no patch files found"
            exit 1
          fi
          for p in "${patches[@]}"; do
            echo "::group::git apply $(basename "$p")"
            git apply --verbose "$p"
            echo "::endgroup::"
          done
          echo "--- device definitions after patching ---"
          grep -n 'jdcloud_re-cs-02' target/linux/qualcommax/image/ipq60xx.mk
          grep -n 'jdcloud,re-cs-02' target/linux/qualcommax/ipq60xx/base-files/etc/board.d/02_network

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare .config
        run: |
          cd openwrt
          cp "$GITHUB_WORKSPACE"/configs/ax6600-25.12.seed .config
          for pkg in ${{ inputs.extra_packages }}; do
            echo "CONFIG_PACKAGE_${pkg}=y" >> .config
          done
          make defconfig
          echo "--- selected target ---"
          grep -E '^CONFIG_TARGET_(qualcommax|qualcommax_ipq60xx|qualcommax_ipq60xx_DEVICE_jdcloud)' .config
          if ! grep -q '^CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-02=y' .config; then
            echo "::error::device jdcloud_re-cs-02 was not selected - backport did not apply"
            exit 1
          fi

      - name: Download package sources
        run: |
          cd openwrt
          make download -j"$(nproc)" || echo "::warning::download reported failures, the build will retry them"

      - name: Build firmware
        run: |
          cd openwrt
          make -j"$(nproc)" || make -j1 V=s

      - name: Collect images
        run: |
          OUT="$GITHUB_WORKSPACE/out"
          mkdir -p "$OUT"
          cd openwrt/bin/targets/qualcommax/ipq60xx
          ls -lh
          cp -v ./*.bin "$OUT"/ 2>/dev/null || true
          cp -v ./*.itb "$OUT"/ 2>/dev/null || true
          cp -v ./*.manifest "$OUT"/ 2>/dev/null || true
          cp -v ./sha256sums "$OUT"/ 2>/dev/null || true
          ls -lh "$OUT"
          if ! ls "$OUT"/*sysupgrade.bin >/dev/null 2>&1; then
            echo "::error::no sysupgrade image produced"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12-ax6600-${{ github.run_number }}
          path: out/*
          retention-days: 14

      - name: Publish release
        if: inputs.create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ax6600-immortalwrt-${{ inputs.ref }}-${{ github.run_number }}
          name: AX6600 ImmortalWrt ${{ inputs.ref }} build ${{ github.run_number }}
          files: out/*
          body: |
            ImmortalWrt `${{ inputs.ref }}` for JDCloud RE-CS-02 (京东云雅典娜 AX6600)

            - Target: `qualcommax / ipq60xx`
            - Device: `jdcloud_re-cs-02`
            - Kernel: 6.12.x (25.12 line)
            - Built from upstream `immortalwrt/immortalwrt` + AX6600 device backport patches
            - `*sysupgrade.bin`: upgrade from an existing OpenWrt/ImmortalWrt, or flash in U-Boot
            - `*initramfs-uImage.itb`: first flash from stock firmware / TFTP recovery

            This is the vanilla ImmortalWrt 25.12 line: no NSS, no PPE offload.
            Verify after flashing: `cat /etc/openwrt_release`
